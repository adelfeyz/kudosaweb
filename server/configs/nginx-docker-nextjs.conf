# Nginx configuration template for Docker-based Next.js instances
# This is a template - use setup-nginx-docker-site.sh to create actual configs
# Replace {DOMAIN}, {INSTANCE_NAME}, {WEBSITE_PORT}, {API_PORT} with actual values

# Upstream for Next.js website container
upstream nextjs_{INSTANCE_NAME} {
    server 127.0.0.1:{WEBSITE_PORT};
    keepalive 64;
}

# Upstream for API container
upstream api_{INSTANCE_NAME} {
    server 127.0.0.1:{API_PORT};
    keepalive 64;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name {DOMAIN} www.{DOMAIN};

    # Allow Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name {DOMAIN} www.{DOMAIN};

    # SSL certificates (set by Certbot)
    ssl_certificate /etc/letsencrypt/live/{DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{DOMAIN}/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/{DOMAIN}-access.log;
    error_log /var/log/nginx/{DOMAIN}-error.log;

    # Increase body size for file uploads
    client_max_body_size 50M;

    # API routes - proxy to API container
    location /api/ {
        proxy_pass http://api_{INSTANCE_NAME}/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint
    location /health {
        proxy_pass http://api_{INSTANCE_NAME}/health;
        access_log off;
    }

    # Next.js application - proxy to website container
    location / {
        proxy_pass http://nextjs_{INSTANCE_NAME};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Cache static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://nextjs_{INSTANCE_NAME};
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

